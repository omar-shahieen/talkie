name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Setup Node.js Environment and install dependencies
        uses: ./.github/actions/setup-node-install-dependencies

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Run affected commands
        run: npx nx affected -t format:check typecheck lint

      - name: do cleanup for CI
        run: npx nx fix-ci
        if: always()
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Setup Node.js Environment and install dependencies
        uses: ./.github/actions/setup-node-install-dependencies

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Run affected commands
        run: npx nx affected -t test

      - name: do cleanup for CI
        run: npx nx fix-ci
        if: always()

  build:
    name: Build
    needs: [quality, unit-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Setup Node.js Environment and install dependencies
        uses: ./.github/actions/setup-node-install-dependencies

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Build applications
        run: npx nx affected -t build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache credentials to Docker
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build Docker images
        run: >-
          npx nx affected -t docker-build -c ci
          --gitCommit=${{ github.sha }}
          --tag=${{ github.sha }}
          --buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx nx affected -t docker-push --tag=${{ github.sha }} --username=${{ vars.DOCKERHUB_USERNAME }}
