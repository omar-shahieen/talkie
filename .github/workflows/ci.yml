name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Setup Node.js Environment and install dependencies
        uses: ./.github/actions/setup-node-install-dependencies

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Run affected commands
        run: npx nx affected -t format:check typecheck lint

      - name: do cleanup for CI
        run: npx nx fix-ci
        if: always()
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Setup Node.js Environment and install dependencies
        uses: ./.github/actions/setup-node-install-dependencies

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Run affected commands
        run: npx nx affected -t test

      - name: do cleanup for CI
        run: npx nx fix-ci
        if: always()

  build:
    name: Build
    needs: [quality, unit-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Setup Node.js Environment and install dependencies
        uses: ./.github/actions/setup-node-install-dependencies

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Build applications
        run: npx nx affected -t build

      - name: Build Docker images
        run: >-
          npx nx affected -t docker-build
          --gitCommit=${{ github.sha }}
          --tag=${{ github.sha }}
          --buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
