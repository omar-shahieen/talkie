apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: talkie
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talkie
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: omarmohamed04/talkie-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main.js"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - containerPort: 3000
          # Startup: allow time for TypeORM initial DB connection retries.
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          # Liveness: process is alive. Independent of Postgres/Redis so a
          # dependency outage never restarts healthy pods.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: can serve traffic (Postgres + Redis reachable, not draining).
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
