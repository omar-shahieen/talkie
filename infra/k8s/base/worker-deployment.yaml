apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: talkie
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talkie
        app.kubernetes.io/component: worker
    spec:
      # Exceeds WORKER_SHUTDOWN_TIMEOUT_MS (30s) so BullMQ jobs drain cleanly.
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: omarmohamed04/talkie-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "100m"
