apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: talkie
resources:
  - ../../base
  - ../../infra/postgres
  - ../../infra/redis
  # - ../../infra/monitoring
replicas:
  - name: api
    count: 2
  - name: frontend
    count: 3
  - name: worker
    count: 1

configMapGenerator:
  - name: app-config
    envs:
      - config.env
    options:
      immutable: true

secretGenerator:
  - name: app-secret
    envs:
      - secret.env
    options:
      immutable: true
